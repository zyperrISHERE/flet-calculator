# Builds an Android APK from main.py using the Flet CLI.
# Docs: https://docs.flet.dev/publish/#github-actions
#
# Place this file at: .github/workflows/build-apk.yml

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

env:
  UV_PYTHON: 3.12       # matches requires-python in pyproject.toml
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      # flet build reads [tool.flet] from pyproject.toml (path=".", so it
      # picks up main.py at the repo root automatically) and produces an APK.
      - name: Build APK
        shell: bash
        run: |
          uv run flet build apk --yes --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: flet-calculator-apk
          path: build/apk
          if-no-files-found: error
